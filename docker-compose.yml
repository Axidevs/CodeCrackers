version: "3.8"

services:
  ml-service:
    build:
      context: .
      dockerfile: ml/Dockerfile
    container_name: cura-ml-service
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - CURA_ML_HOST=0.0.0.0
      - CURA_ML_PORT=8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - cura-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cura-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - ML_SERVICE_URL=http://ml-service:8000/predict
      - ML_SERVICE_TIMEOUT_MS=2000
      - EMERGENCY_NUMBER=112
      - AMBULANCE_NUMBER=108
    depends_on:
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cura-network

networks:
  cura-network:
    driver: bridge
