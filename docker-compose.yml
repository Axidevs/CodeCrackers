version: "3.8"

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cura-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - ML_SERVICE_URL=http://ml-service:8000/predict
      - ML_SERVICE_TIMEOUT_MS=2000
      - EMERGENCY_NUMBER=112
      - AMBULANCE_NUMBER=108
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cura-network

networks:
  cura-network:
    driver: bridge
